# Blueprint Render : déploiement en un clic (web service + PostgreSQL).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mikrovoucher-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mikrovoucher-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_SSL_INSECURE
        value: "true"
      # Render remplit l'URL publique du service : les scripts routeur générés
      # pointent ainsi tout de suite au bon endroit.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: mikrovoucher-manager
          property: host
      # À renseigner au déploiement (laisser vide pour démarrer sans paiement).
      - key: PAYM_CLIENT_ID
        sync: false
      # Origines des portails captifs, ex : http://lambda.connect,http://172.17.10.1
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: mikrovoucher-db
    plan: free
