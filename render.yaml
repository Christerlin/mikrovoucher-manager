# Blueprint Render : déploiement en un clic (web service + PostgreSQL).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mikrovoucher-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mikrovoucher-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_SSL_INSECURE
        value: "true"
      - key: PAYM_CLIENT_ID
        sync: false

databases:
  - name: mikrovoucher-db
    plan: free
