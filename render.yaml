# Blueprint Render : déploiement en un clic (web service + PostgreSQL).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mikrovoucher-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Chaîne de connexion PostgreSQL. Neon (https://neon.tech) est recommandé :
      # offre gratuite qui n'expire pas, contrairement aux bases gratuites Render.
      # Utilisez la chaîne "direct" (sans -pooler) et gardez ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      # PUBLIC_URL n'est pas listé : Render fournit RENDER_EXTERNAL_URL, que
      # l'application utilise automatiquement. (Ne pas utiliser fromService/host
      # ici : il renvoie le nom interne du service, injoignable depuis Internet.)
      # À renseigner au déploiement (laisser vide pour démarrer sans paiement).
      - key: PAYM_CLIENT_ID
        sync: false
      # Origines des portails captifs, ex : http://lambda.connect,http://172.17.10.1
      - key: CORS_ORIGINS
        sync: false
